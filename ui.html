<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      /*
        PantonLEELab · Fit to Parent
        这是插件 UI 面板（iframe）里的样式。
        目标：简单、耐看、可快速点击。
      */
      body {
        font: 12px/1.4 -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif;
        margin: 12px;
        color: rgba(0, 0, 0, 0.85);
      }

      .header {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 0 0 8px;
      }

      .logo {
        width: 20px;
        height: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .title {
        font-size: 13px;
        font-weight: 600;
      }

      .row {
        display: flex;
        gap: 8px;
        margin-top: 8px;
      }

      .section-header {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 14px;
      }

      .section-icon {
        width: 18px;
        height: 18px;
        border-radius: 6px;
        border: 1px solid rgba(0, 0, 0, 0.12);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        font-weight: 700;
        color: rgba(0, 0, 0, 0.7);
      }

      .section-title {
        margin-top: 0;
        font-size: 12px;
        font-weight: 600;
      }

      button {
        flex: 1;
        padding: 10px 12px;
        border: 1px solid rgba(0, 0, 0, 0.12);
        border-radius: 12px;
        background: #fff;
        cursor: pointer;
      }

      button.primary {
        background: #111;
        border-color: #111;
        color: #fff;
      }

      button:active {
        transform: translateY(1px);
      }

      select {
        flex: 1;
        padding: 8px 32px 8px 10px; /* 右侧留出空间给下拉箭头 */
        border: 1px solid rgba(0, 0, 0, 0.12);
        border-radius: 10px;
        background-color: #fff;

        /* 让箭头离右边框远一点（macOS / Chrome / Figma 内嵌 WebView 都生效） */
        background-image:
          linear-gradient(45deg, transparent 50%, rgba(0,0,0,0.5) 50%),
          linear-gradient(135deg, rgba(0,0,0,0.5) 50%, transparent 50%);
        background-position:
          calc(100% - 16px) calc(50% - 2px),
          calc(100% - 11px) calc(50% - 2px);
        background-size: 5px 5px, 5px 5px;
        background-repeat: no-repeat;

        appearance: none;
        -webkit-appearance: none;
        -moz-appearance: none;
      }

      .hint {
        margin-top: 8px;
        color: rgba(0, 0, 0, 0.55);
      }
    </style>
  </head>

  <body>
    <div class="header">
      <!-- 这里放你的 Logo：当前是一个内联 SVG 占位，你可以替换为自己的 SVG（推荐） -->
      <div class="logo" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="1" y="1" width="16" height="16" rx="5" stroke="rgba(0,0,0,0.35)" />
          <path d="M6 12V6h2.4c1.5 0 2.4.8 2.4 2 0 1.2-.9 2-2.4 2H7.3V12H6Zm1.3-3.2h1.1c.8 0 1.3-.3 1.3-.8s-.5-.8-1.3-.8H7.3v1.6Z" fill="rgba(0,0,0,0.7)"/>
        </svg>
      </div>
      <div class="title">自动适配到容器</div>
    </div>

    <div class="row">
      <button id="fit">适合复合</button>
      <button id="fitW">适合宽度</button>
      <button id="fitH">适合高度</button>
    </div>

    <div class="hint">
      复合变换用法1（单选）：选中任意图层 → 点击按钮（保持比例）<br />
      复合变换用法2（多选）：在同一容器内选中多个<strong>子层</strong> → 自动按它们的父级容器适配<br />
      快捷键（仅对本区生效）：1/2/3
    </div>

    <div class="section-header">
      <div class="section-icon" aria-hidden="true">T</div>
      <div class="section-title">行高预设</div>
    </div>

    <div class="row">
      <button id="lhAuto">Auto</button>
      <button id="lhSmart" class="primary">智能行高</button>
    </div>

    <div class="row">
      <select id="lineHeightSelect">
        <option value="auto">Auto — 跟随字体默认</option>
        <option value="1.0">1.0 — 紧凑排版/数据密集</option>
        <option value="1.1">1.1 — 英文UI小字号紧凑</option>
        <option value="1.2">1.2 — EN推荐/英文正文舒适</option>
        <option value="1.3">1.3 — 英文偏松/副标题</option>
        <option value="1.4">1.4 — ZH UI推荐/中文正文偏紧</option>
        <option value="1.5">1.5 — ZH段落推荐/中文段落舒适</option>
        <option value="1.6">1.6 — ZH衬线/长文推荐</option>
        <option value="1.8">1.8 — 阅读无障碍/轻松</option>
        <option value="2.0">2.0 — 超松/强阅读性</option>
      </select>
    </div>

    <div class="hint">
      行高用法：选中文本（或选中一个容器让它递归处理内部文本） → 点预设按钮/下拉选项<br />
      说明：遇到混合字号/混合字体（mixed）的文本会自动跳过，并在提示里汇总数量
    </div>

    <script>
      /**
       * UI -> 插件（code.js）通信方式：
       * UI 面板运行在 iframe 中，不能直接调用 figma API。
       * 需要通过 parent.postMessage({ pluginMessage: {...} }, '*')
       * 把消息发到插件主线程，然后在 code.js 里用 figma.ui.onmessage 接收。
       */
      const send = (type, payload = {}) => parent.postMessage({ pluginMessage: { type, ...payload } }, '*');

      document.getElementById('fit').onclick = () => send('fit');
      document.getElementById('fitW').onclick = () => send('fitWidth');
      document.getElementById('fitH').onclick = () => send('fitHeight');
      document.getElementById('lhAuto').onclick = () => send('lineHeightPreset', { preset: 'auto' });
      document.getElementById('lhSmart').onclick = () => send('lineHeightPreset', { preset: 'smart' });

      document.getElementById('lineHeightSelect').onchange = (event) => {
        const preset = event.target.value;
        if (!preset) return;
        send('lineHeightPreset', { preset });
      };

      window.addEventListener('keydown', (e) => {
        if (e.key === '1') send('fit');
        if (e.key === '2') send('fitWidth');
        if (e.key === '3') send('fitHeight');
      });
    </script>
  </body>
</html>
